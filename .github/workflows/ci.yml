name: CI

# Every push and every pull request against main triggers verification.
# Combined with branch protection, this makes it impossible to merge code
# that does not pass the same checks Caio runs locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never run two jobs from the same branch in parallel: newer pushes cancel
# older in-flight runs. Saves free-tier minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------- #
  # Job 1: Python code quality + tests. Everything needed to reproduce
  # `ruff check` and `pytest` locally, but in a clean Ubuntu environment.
  # ---------------------------------------------------------------------- #
  python-checks:
    name: Ruff and pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with serve, demo and dev extras
        run: |
          python -m pip install --upgrade pip
          # pyproject.toml is the source of truth for dependencies.
          # `-e` makes `src` importable; extras pull in fastapi/pydantic
          # (needed by test_api.py) and pytest/ruff/httpx (needed by the
          # suite itself).
          pip install -e ".[serve,dev,demo]"

      - name: Ruff — style and static checks
        run: ruff check src/ tests/ demo/ scripts/demo/

      - name: Pytest — full acceptance suite
        run: pytest -v

  # ---------------------------------------------------------------------- #
  # Job 2: Dockerfile static analysis. Independent from the Python job
  # so a bad Dockerfile does not hide test failures and vice versa.
  # ---------------------------------------------------------------------- #
  dockerfile-lint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # === AMLGUARD DAY 12 START ===
  publish-image:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - python-checks
      - dockerfile-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=AMLGuard API
            org.opencontainers.image.description=AML risk-scoring API for extreme class imbalance
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          echo "### AMLGuard container published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: ghcr.io" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ghcr.io/${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: ${{ steps.build-and-push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  # === AMLGUARD DAY 12 END ===
