# AMLGuard - local development orchestration
#
# `docker compose up`        build (if needed) and run the API on http://localhost:8000
# `docker compose up --build` force a rebuild before running
# `docker compose down`      stop the container
#
# The model artifact is bind-mounted from ./artifacts/model.joblib so the same
# image can score with a freshly retrained model without a rebuild. If the file
# does not exist yet, run `python -m src.models.train` locally first.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: amlguard:latest
    container_name: amlguard-api
    ports:
      - "8000:8000"
    volumes:
      # Read-only mount of the trained model. Comment out to start without a
      # model (useful for exploring /health and /docs while training runs).
      - ./artifacts/model.joblib:/app/artifacts/model.joblib:ro
    restart: unless-stopped
    healthcheck:
      # Reuses the container's own HEALTHCHECK defined in the Dockerfile; this
      # entry exists so `docker compose ps` reports the health status column.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
